services:
  - type: web
    name: investsphere
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r web/backend/requirements.txt
    startCommand: gunicorn --chdir web/backend wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: /opt/render/project/data/investsphere_web.db
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: IPOALERTS_API_KEY
        sync: false
    disk:
      name: investsphere-data
      mountPath: /opt/render/project/data
      sizeGB: 1
    healthCheckPath: /api/health

